name: DCO

# Checks that every commit in a pull request is signed off (git commit -s). It only reads commit
# messages through the API: no checkout, no fork code runs, no secrets.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const missing = [];
            for (const c of commits) {
              // Merge commits (e.g. "Update branch") carry no sign-off; the squash drops them.
              if (c.parents.length > 1) continue;
              const signers = [...c.commit.message.matchAll(/^Signed-off-by: .+ <([^>]+)>\s*$/gim)]
                .map((m) => m[1].toLowerCase());
              const emails = [c.commit.author?.email, c.commit.committer?.email]
                .filter(Boolean)
                .map((e) => e.toLowerCase());
              if (!signers.some((s) => emails.includes(s))) missing.push(c);
            }
            if (missing.length === 0) {
              core.info(`All ${commits.length} commits are signed off.`);
              return;
            }
            for (const c of missing) {
              core.error(`${c.sha.slice(0, 7)} ${c.commit.message.split("\n")[0]}`);
            }
            core.setFailed(
              `${missing.length} commit(s) have no Signed-off-by line matching the author. ` +
                "Run `git rebase --signoff main` and `git push --force-with-lease`. See CONTRIBUTING.md.",
            );
